name: Release Desktop Installers
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave empty to use v<package.json version>."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${PKG_VER}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Release tag=${TAG} version=${VER}"

  build-linux:
    name: Build Linux (.deb, .rpm, .tar.gz)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Linux OCR, desktop, and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-jpn-vert xvfb libasound2t64 rpm dpkg-dev
      - run: npm ci
      - run: npm run desktop:native -- linux-x64
      - run: npm test
      - run: npm run desktop:package -- linux-x64
      - name: Smoke test packaged Linux app
        run: xvfb-run -a npm run test:desktop -- --packaged
      - name: Build .deb (Debian/Ubuntu), .rpm (Fedora), and .tar.gz
        run: node scripts/package-release.mjs linux-x64 "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-dist/*
          if-no-files-found: error

  build-windows:
    name: Build Windows 10/11 (.exe Setup & Portable .zip)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Windows OCR and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") -and -not (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - run: npm ci
      - run: npm run desktop:native -- win-x64
      - run: npm test
      - run: npm run desktop:package -- win-x64
      - name: Smoke test packaged Windows app
        run: npm run test:desktop -- --packaged
      - name: Build Windows Setup (.exe) and Portable (.zip)
        run: node scripts/package-release.mjs win-x64 "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: release-dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [meta, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          cat << EOF > release-notes.md
          # Nixio (Khung Thoại) ${TAG}

          Bản phát hành chính thức **Nixio (Khung Thoại) ${TAG}** — ứng dụng biên tập, xóa chữ (redraw), OCR, dịch thuật và dàn thoại truyện tranh/manga với lõi xử lý ảnh **C#/.NET 10** tự chứa, hỗ trợ **Windows 10/11**, **Ubuntu / Debian-based Linux** và **Fedora Linux**.

          ## Tải về theo hệ điều hành

          | Hệ điều hành | Gói cài đặt | Cách cài đặt nhanh |
          |---|---|---|
          | **Windows 10 / 11 (x64)** | \`Khung-Thoai-${VER}-win-x64-setup.exe\` | Chạy trình cài đặt (không cần quyền Admin, tự liên kết tệp \`.khungthoai\`) |
          | **Windows 10 / 11 (Portable)** | \`Khung-Thoai-${VER}-win-x64-portable.zip\` | Giải nén và chạy \`Khung-Thoai.exe\` |
          | **Ubuntu / Debian / Mint / Pop!_OS (x64)** | \`khung-thoai_${VER}_amd64.deb\` | \`sudo apt install ./khung-thoai_${VER}_amd64.deb\` |
          | **Fedora Linux (x64)** | \`khung-thoai-${VER}-1.x86_64.rpm\` | \`sudo dnf install ./khung-thoai-${VER}-1.x86_64.rpm\` |
          | **Linux khác (Portable x64)** | \`khung-thoai-${VER}-linux-x64.tar.gz\` | Giải nén và chạy \`./Khung-Thoai\` |

          ## Bật OCR cục bộ (tùy chọn)
          Ứng dụng tích hợp sẵn lõi redraw/inpaint C#/.NET 10. Để dùng thêm **OCR offline**:
          - **Ubuntu / Debian**: \`sudo apt install tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn tesseract-ocr-jpn-vert\`
          - **Fedora**: \`sudo dnf install tesseract tesseract-langpack-eng tesseract-langpack-jpn tesseract-langpack-jpn_vert\`
          - **Windows 10/11**: Cài [UB-Mannheim Tesseract](https://github.com/UB-Mannheim/tesseract/wiki) hoặc \`winget install UB-Mannheim.TesseractOCR\`

          ## Điểm nổi bật trong ${TAG}
          - **Redraw & Typeset Pro (PhotoCraft)**:
            - **Poisson Seamless Blending C#** cho Multi-Scale PatchMatch Inpaint — hòa khớp ánh sáng/chuyển sắc biên tuyệt đối không lộ viền ghép.
            - **Làm sạch ảnh Raw tự động** (cân bằng trắng từng kênh R/G/B khử ố vàng giấy scan + khử nhiễu bilateral giữ screentone + tăng sắc nét nhẹ trên C# & JS).
            - **Cọ tẩy nét Redraw** xóa cục bộ nét vẽ/inpaint bị lem lên nét nhân vật.
            - **Dàn chữ ôm bong bóng bầu dục (\`Ôm bong bóng\`)** tương thích auto-fit và **Uốn chữ SFX** (\`arc\`, \`arcDown\`, \`wave\`).
          - **Trợ lý AI · Agent Harness v2.5 (DeepSeek Harness)**:
            - Tự thử lại LLM (\`withLlmRetry\` exponential backoff) cho lỗi 429/5xx và chống lặp công cụ (\`RepeatToolGuard\`).
            - **Thẻ hỏi trắc nghiệm \`ask_user\`**, **duyệt thao tác hàng loạt**, **5 Hồ sơ kỹ năng theo thể loại** áp dụng cho cả Chat và Dịch ảnh/khung chữ.
            - **Lệnh nhanh Slash Commands** (\`/qc\`, \`/plan\`, \`/autofit\`, \`/compact ai\`, \`/skill\`, \`/help\`), tóm tắt lịch sử bằng LLM và tự động lưu phiên chat/Todo theo từng dự án.
          - **Kiểm tra cập nhật & Trung tâm Thông báo**: Tự phát hiện bản mới qua GitHub Releases (\`wiothemilo-lang/Nixio\`), cảnh báo khung tràn chữ kèm nút 1 chạm **Khớp cỡ cả trang** và nhắc lưu dự án.

          Kiểm tra toàn vẹn tệp bằng \`SHA256SUMS.txt\`.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Nixio (Khung Thoại) ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Nixio (Khung Thoại) ${TAG}" \
              --notes-file release-notes.md
          fi
